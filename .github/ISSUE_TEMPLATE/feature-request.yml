name: Feature request
description: Propose a reusable runtime or authoring capability.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the host workflow or authoring limitation, not only the requested API.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Why the package should own it
      description: Explain why this belongs in the reusable runtime instead of a product adapter or fixture.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Include expected behavior for pause, seek, replay, failure, and cleanup when applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
