name: Bug report
description: Report a reproducible runtime, camera, or package problem.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must be reported privately through the repository Security tab, not through this form.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Core runtime
        - React adapter
        - Camera
        - Playground
        - Documentation or package contents
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link a small repository or provide the smallest definition and host code that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node.js, browser, React, operating system, and package manager versions when relevant.
    validations:
      required: true
