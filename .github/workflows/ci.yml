name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check package
        run: pnpm check

  playground:
    name: Playground / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            playground/pnpm-lock.yaml
      - name: Install package dependencies
        run: pnpm install --frozen-lockfile
      - name: Install playground dependencies
        run: pnpm --dir playground install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir playground exec playwright install --with-deps chromium
      - name: Build playground
        run: pnpm --dir playground build
      - name: Run browser tests
        run: pnpm --dir playground test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playground-diagnostics
          path: |
            playground/playwright-report/
            playground/test-results/
          if-no-files-found: ignore
          retention-days: 7
