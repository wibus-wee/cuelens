name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install current npm CLI
        run: npm install --global npm@11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json')).version")
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version." >&2
            exit 1
          fi
          visibility=$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)
          if [[ "$visibility" != "PUBLIC" ]]; then
            echo "Repository must be public before publishing an open-source package." >&2
            exit 1
          fi
      - name: Check release
        run: pnpm check
      - name: Detect an existing npm version
        id: npm-version
        run: |
          package_name=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json')).name")
          package_version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json')).version")
          if npm view "$package_name@$package_version" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish --access public --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
