version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      package-toolchain:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /playground
    schedule:
      interval: monthly
    groups:
      playground:
        patterns:
          - '*'
